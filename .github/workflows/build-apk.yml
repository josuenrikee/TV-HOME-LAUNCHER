name: Compilar APK

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/tvhome.apk
          echo "APK: $(stat -c %s dist/tvhome.apk) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: dist/tvhome.apk

      - name: Publicar release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/tvhome.apk \
            --title "Launcher (última versión)" \
            --notes "APK compilado automáticamente desde ${GITHUB_SHA::7}. Se instala con scripts/install.ps1."
