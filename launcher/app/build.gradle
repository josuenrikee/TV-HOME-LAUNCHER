plugins {
    id 'com.android.application'
}

android {
    namespace 'ec.josue.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'ec.josue.tvhome'
        minSdk 26
        targetSdk 34
        versionCode 31
        versionName '0.1.30'
    }

    // Llave fija y versionada: sin ella cada compilacion en CI genera una llave de depuracion nueva
    // y Android rechaza actualizar encima (INSTALL_FAILED_UPDATE_INCOMPATIBLE). El APK solo se instala
    // por ADB en TVs propios, no se publica en ninguna tienda.
    signingConfigs {
        tvhome {
            storeFile file('tvhome.keystore')
            storePassword 'tvhome123'
            keyAlias 'tvhome'
            keyPassword 'tvhome123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tvhome
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
